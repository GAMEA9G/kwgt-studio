function anchorPicker(m){const w=mk("div",{className:"f"});w.append(mk("label",{},"Pin to parent (anchor)"));const g=mk("div");g.style.cssText="display:grid;grid-template-columns:repeat(3,34px);gap:3px";const A=[["TOPLEFT","TOP","TOPRIGHT"],["CENTERLEFT","CENTER","CENTERRIGHT"],["BOTTOMLEFT","BOTTOM","BOTTOMRIGHT"]],cur=m.position_anchor||"TOPLEFT";
